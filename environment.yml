# Conda environment for the whole pipeline (scripts 01-07 and analysis/).
#
#   conda env create -f environment.yml          # new environment "condaml"
#   conda env update -n condaml -f environment.yml   # or update an existing condaml
#   conda activate condaml
#   pip install --no-deps git+https://github.com/Clay-foundation/model.git   # Clay (see note)
#
# Note on Clay: the Clay package pins einops 0.7, while TerraTorch (Prithvi, TerraMind) needs a
# newer einops. Clay works with the newer version, so it is installed with --no-deps; its other
# requirements are listed below.
name: condaml
channels:
  - conda-forge
dependencies:
  - python=3.11
  # geospatial
  - geopandas
  - rasterio
  - shapely>=2
  - pyproj
  - pyogrio
  - pyarrow                 # GeoParquet tile index (04_build_tiles.py)
  - gdal                    # osgeo Python bindings + gdalbuildvrt (cropland_extent/, cropland mask VRTs)
  - earthengine-api          # Dynamic World only (data_download/02a, 04c)
  - geemap=0.37             # region-wide download of an Earth Engine image (02a, 04c)
  - geedim<2                # used by geemap 0.37 (the 1.x API)
  - planetary-computer      # signed URLs: Sentinel-1 RTC (data_download/02c_s1.py), ESA WorldCover (04a)
  - pystac-client           # STAC search (data_download/stac_common.py, 04a)
  - stackstac               # read STAC scenes onto the block grid (data_download/stac_common.py)
  # data + machine learning
  - numpy
  - pandas
  - scipy
  - scikit-learn>=1.4
  - joblib
  - pyyaml
  - requests
  - tqdm                    # download progress bars
  - pillow
  # deep learning (CPU, CUDA or Apple Silicon)
  - pytorch
  - torchvision
  # figures and interactive work
  - matplotlib
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - terratorch            # Prithvi-EO-2.0 and TerraMind backbones (and their dependencies)
      - mmengine              # AgriFM encoder (registry + checkpoint loading)
      - timm
      - einops
      - lightning             # needed by Clay
      - python-box            # needed by Clay
      - vit-pytorch           # needed by Clay
      - wandb                 # imported by Clay
      # documentation website (mkdocs.yml)
      - mkdocs>=1.6,<2        # MkDocs 2 drops plugins and themes
      - mkdocs-material
      - mkdocs-literate-nav
      - mkdocs-glightbox      # click an image to enlarge it
