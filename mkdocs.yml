# Documentation website of the project (MkDocs + Material theme). ALL documentation lives in docs/.
#   pip install "mkdocs>=1.6,<2" mkdocs-material mkdocs-literate-nav     (or: conda env update -f environment.yml)
#   mkdocs serve            preview at http://127.0.0.1:8000 (reloads on every change)
#   mkdocs build --strict   check: stops on broken links or pages missing from the navigation
#   mkdocs gh-deploy        publish to GitHub Pages (also done automatically on every push to main)
# Navigation: docs/SUMMARY.md. Rules for keeping the documentation up to date: CLAUDE.md.

site_name: Irrigated Cropland Mapping with GeoFMs
site_description: Evaluating geospatial foundation models for irrigated cropland mapping 
site_author: Aman Chaudhary
site_url: https://amanchry.github.io/irrimapping-geofm/
repo_url: https://github.com/amanchry/irrimapping-geofm
repo_name: amanchry/irrimapping-geofm
edit_uri: edit/main/docs/
copyright: Aman Chaudhary

docs_dir: docs
site_dir: site
exclude_docs: |
  .DS_Store
not_in_nav: |
  weekly/_template.md
  references/_template.md
  data_source/flowchat.md

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

plugins:
  - search:
      lang: en
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - def_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}   # same anchors as GitHub
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:                       # :material-...: icons in the home-page cards
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid                    # rendered by assets/javascripts/mermaid.js (keeps the diagram colours)
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_div_format

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
