# E02: main comparison of RQ1 with the final validation design (PASTIS rotation).
id: E02
title: "Frozen GeoFMs + PCA + classical classifiers"
short_title: PCA + LogReg / RF / SVM   # name in the site's sidebar
status: done
listed: true
research_question: RQ1
phase: 2                  # phase of the research plan (docs/research_plan.md)
question: Do frozen foundation-model embeddings separate irrigated from rainfed parcels better than Sentinel-2 features, with the same parcels, folds and classifiers? (Sentinel-2 only for every input, D14)
changes_from: "E01: validation nested -> pastis (3 folds train, next fold validation, 1 fold test)"
answer: "Morocco: GeoFMs equal the S2 baseline (about 0.90 with SVM), AgriFM worse. Utah: Clay, Prithvi, TerraMind +0.05 to +0.06 with SVM; the best GeoFM (Clay SVM 0.791) is 0.03 above the baseline best head (RF 0.764)."

regions: [morocco, utah]   # planned (P2 of the experiment plan): one results folder per region
inputs: [s1s2, clay, prithvi, terramind, agrifm]
label_efficiency:          # learning curve inside this experiment (Q5 of the plan): training blocks subsampled
  fractions: [0.10, 0.25, 0.50]   # share of the training blocks; 1.0 = the main run
  draws: 3                        # block draws per fraction; draw k is identical in every experiment and input (paired)
  min_rainfed: 20                 # fixed in models_run/experiment_utils.py (MIN_RAINFED); nested draws: 10% ⊂ 25% ⊂ 50%

steps: [train_evaluate, compare, breakdown, report]

train_evaluate:            # models_run/03_train_evaluate.py
  VALIDATION: pastis       # 3 folds train, next fold chooses the hyperparameters, 1 fold tests
  WINDOW: agyear
  S1S2_SOURCE: tiles
  TILE_FEATURES: inner
  S1_ORBIT: chips          # not used with S1S2_VARIABLES: s2
  S1S2_VARIABLES: s2       # Sentinel-2 only (D14)
  EMB_SOURCE: tiles
  FEATURE_MODE: concat
  PCA_DIM: 128
  RF_TREES: 500
  N_BOOT: 1000
  SEED: 42

compare:                   # models_run/04_compare_models.py
  BASELINE_CLASSIFIER: rf

report:
  HEADLINE_CLASSIFIERS: [rf, logreg]
