# E03: same input as E02 (12 months concatenated -> PCA 128), but a trained MLP head instead of the classical classifiers.
id: E03
title: "Frozen GeoFMs + PCA + MLP head"
short_title: PCA + MLP head   # name in the site's sidebar
status: ready
listed: true
research_question: RQ1
phase: 2                  # phase of the research plan (docs/research_plan.md)
question: Does a trainable neural head get more out of the same PCA input than logistic regression, random forest and SVM?
changes_from: "E02: classifier LogReg / RF / SVM -> MLP head (128-256-128-2), 3 seeds"
answer: ""

regions: [morocco, utah]   # planned (P2 of the experiment plan): one results folder per region
inputs: [s1s2, clay, prithvi, terramind, agrifm]   # Sentinel-2 only (D14)
label_efficiency:          # learning curve inside this experiment (Q5 of the plan): training blocks subsampled
  fractions: [0.10, 0.25, 0.50]   # share of the training blocks; 1.0 = the main run
  draws: 3                        # block draws per fraction; draw k is identical in every experiment and input (paired)
  seeds_per_draw: 1               # neural runs: one seed per draw (the main run keeps its 3 seeds)
  min_rainfed: 20                 # fixed in models_run/experiment_utils.py (MIN_RAINFED); nested draws: 10% ⊂ 25% ⊂ 50%

steps: [ltae, compare, breakdown, report]

ltae:                      # models_run/03c_train_ltae.py (same output format as 03)
  HEAD: mlp                # MLP on the PCA input (E04 uses HEAD: ltae)
  FEATURE_MODE: concat
  PCA_DIM: 128
  VALIDATION: pastis
  MLP: [256, 128]
  DROPOUT: 0.2
  LEARNING_RATE: 0.001
  WEIGHT_DECAY: 0.0001
  BATCH_SIZE: 128
  EPOCHS: 100
  PATIENCE: 15
  N_SEEDS: 3

compare:
  BASELINE_CLASSIFIER: rf
  EXTRA_RUNS: ["E02_frozen_pca/*"]   # the E02 runs (same input, classical heads) on the same parcels

report:
  HEADLINE_CLASSIFIERS: [mlp, logreg, rf]
