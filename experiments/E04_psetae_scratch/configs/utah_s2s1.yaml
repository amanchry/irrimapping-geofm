# E04 - PSE-TAE trained from scratch: Utah, 10 Sentinel-2 bands + Sentinel-1 VV, VH
# One run of models_run/03b_train_psetae.py. Same setting names as at the top of the script; anything not listed
# keeps the script's value. Results: experiments/E04_psetae_scratch/results/psetae_utah_views_2023-24_s2s1/
REGION: utah
VIEWS_NAME: views_2023-24  # 2023/24 only; Sentinel-1 descending (views_info.json)
BANDS: s2s1

N_PIXELS: 64                 # pixels sampled per parcel (paper: 64)
MAX_EPOCHS: 100
PATIENCE: 15                 # early stopping on validation macro-F1
SEED: 42
QUICK_TEST: false            # true = 3 epochs, 100 bootstrap draws (only to check that everything runs)
