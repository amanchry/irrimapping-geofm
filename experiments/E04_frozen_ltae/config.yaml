# E04: same as E02, but the 12 monthly embeddings are combined by a trained L-TAE instead of concat + PCA.
id: E04
title: "Frozen GeoFMs + L-TAE temporal aggregation + MLP head"
short_title: L-TAE + MLP head   # name in the site's sidebar
status: done
listed: true
research_question: RQ1
phase: 2                  # phase of the research plan (docs/research_plan.md)
question: Does a learned temporal aggregation (L-TAE) of the monthly embeddings classify better than concat + PCA, for the GeoFMs and for the monthly Sentinel-2 features? (Sentinel-2 only, D14)
changes_from: "E03: temporal aggregation concat + PCA 128 -> L-TAE (Garnot & Landrieu 2020), as in PANGAEA; same MLP head"
answer: "L-TAE = concat + PCA with the same MLP (within 0.01), not better. Morocco: Clay 0.906 ties S2 0.905. Utah: Clay and Prithvi +0.04 over S2 with the same head; +0.02 over the S2 RF."

regions: [morocco, utah]   # planned (P2 of the experiment plan): one results folder per region
inputs: [s1s2, clay, prithvi, terramind]   # AgriFM gives one vector per year (no months to aggregate)
label_efficiency:          # learning curve inside this experiment (Q5 of the plan): training blocks subsampled
  fractions: [0.10, 0.25, 0.50]   # share of the training blocks; 1.0 = the main run
  draws: 3                        # block draws per fraction; draw k is identical in every experiment and input (paired)
  seeds_per_draw: 1               # neural runs: one seed per draw (the main run keeps its 3 seeds)
  min_rainfed: 20                 # fixed in models_run/experiment_utils.py (MIN_RAINFED); nested draws: 10% ⊂ 25% ⊂ 50%

steps: [ltae, compare, breakdown, report]

ltae:                      # models_run/03c_train_ltae.py (same output format as 03)
  HEAD: ltae               # L-TAE + MLP on the monthly sequence (E03 uses HEAD: mlp)
  VALIDATION: pastis
  N_HEADS: 16
  D_K: 8
  D_MODEL: 256
  MLP: [256, 128]
  EPOCHS: 100
  PATIENCE: 15
  N_SEEDS: 3

compare:
  BASELINE_CLASSIFIER: rf
  EXTRA_RUNS:              # E03 (same MLP head, PCA) and E02 (classical heads), same parcels and bootstrap draws
    - "E03_frozen_pca_mlp/*"
    - "E02_frozen_pca/*"

report:
  HEADLINE_CLASSIFIERS: [ltae, rf, logreg]
