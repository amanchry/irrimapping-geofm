# E01: first full run on the 128 px tile store (October 2026), with the nested validation design.
id: E01
title: Frozen GeoFMs + PCA vs the S1/S2 baseline (nested spatial CV)
short_title: PCA pipeline · nested CV   # name in the site's sidebar
status: done
listed: true
research_question: RQ1
question: Do frozen foundation-model embeddings separate irrigated from rainfed parcels better than Sentinel-1/2 features, with the same parcels, folds and classifiers?
changes_from: first experiment on the shared 128 px tile store with patch-aligned chips
answer: "No frozen GeoFM beats the S1/S2 baseline (best Clay + SVM 0.910 vs 0.906, difference within the noise); Clay and Prithvi hold up better in the hardest fold."

inputs: [s1s2, clay, prithvi, terramind, agrifm]
steps: [train_evaluate, compare, report]

train_evaluate:            # models_run/03_train_evaluate.py
  VALIDATION: nested       # inner spatial CV on the 4 training folds, refit on all 4
  WINDOW: agyear
  S1S2_SOURCE: tiles
  TILE_FEATURES: inner
  S1_ORBIT: chips
  S1S2_VARIABLES: all
  EMB_SOURCE: tiles
  FEATURE_MODE: concat
  PCA_DIM: 128
  RF_TREES: 500
  N_BOOT: 1000
  SEED: 42

compare:                   # models_run/04_compare_models.py
  BASELINE_CLASSIFIER: rf

report:
  HEADLINE_CLASSIFIERS: [rf, logreg]
