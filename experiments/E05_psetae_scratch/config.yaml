# E05: deep model trained from scratch on the pixel sets (no pretraining); the neural baseline of RQ1.
id: E05
title: "PSE-TAE trained from scratch on Sentinel-2 pixel sets (neural baseline)"
short_title: PSE-TAE from scratch   # name in the site's sidebar
status: ready
listed: true
research_question: RQ1
phase: 2                  # phase of the research plan (docs/research_plan.md)
question: Does a temporal deep model trained only on our labelled parcels match the frozen foundation models?
changes_from: "E02: no pretrained encoder; PSE-TAE (Garnot et al. 2020) on 64 random pixels per parcel, Sentinel-2 only, 3 seeds"
answer: ""

regions: [morocco, utah]
inputs: []               # PSE-TAE reads the pixel sets (psetae_configs below)
label_efficiency:          # learning curve inside this experiment (Q5 of the plan): training blocks subsampled
  fractions: [0.10, 0.25, 0.50]   # share of the training blocks; 1.0 = the main run
  draws: 3                        # block draws per fraction; draw k is identical in every experiment and input (paired)
  seeds_per_draw: 1               # neural runs: one seed per draw (the main run keeps its 3 seeds)
  min_rainfed: 20                 # fixed in models_run/experiment_utils.py (MIN_RAINFED); nested draws: 10% ⊂ 25% ⊂ 50%

steps: [psetae, compare, breakdown, report]

# models_run/03b_train_psetae.py runs once per file in configs/ (each file holds all settings of one run)
psetae_configs: [morocco_s2.yaml, utah_s2.yaml]   # Sentinel-2 only (D14); morocco_s2s1.yaml = Sentinel-1 ablation
                                                  # (utah_s2s1.yaml kept but not used: Sentinel-1 is thin in Utah)

compare:
  BASELINE_CLASSIFIER: rf
  EXTRA_RUNS: ["E02_frozen_pca/*"]   # baseline and GeoFMs of E02 on the same parcels

report:
  HEADLINE_CLASSIFIERS: [psetae]
